name: Deploy SST test

on:
  workflow_dispatch:
    inputs:
      enable_legacy_file_reads:
        description: Enable reconciled Base44 legacy-file reads in test
        required: true
        type: boolean
        default: false
      expected_legacy_import_manifest_sha256:
        description: Exact verified source manifest SHA-256 (required when enabling)
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "sst.config.ts"
      - "infra/sst/**"
      - "backend/api/**"
      - "src/api/**"
      - "src/App.jsx"
      - "src/pages/Maintenance.jsx"
      - "src/lib/maintenance-status.js"
      - "src/lib/__tests__/maintenance-status.test.js"
      - "e2e/**"
      - "playwright.config.js"
      - "lambda/pdf-generator/**"
      - "src/lib/pdf-api.js"
      - "src/lib/__tests__/pdf-api.test.js"
      - "src/pages/PdfSignIframeOverlay.jsx"
      - "tooling/verify_pdf_bundle.mjs"
      - "tooling/verify_pdf_bundle.test.mjs"
      - "tooling/verify_pdf_parity.mjs"
      - "tooling/verify_pdf_parity.test.mjs"
      - "docs/migration/pdf-parity-runbook.md"
      - "tooling/verify_sst_foundation.mjs"
      - "tooling/production-readiness-contract.json"
      - "tooling/verify_production_readiness.mjs"
      - "tooling/verify_production_readiness.test.mjs"
      - "tooling/verify_runtime_independence.mjs"
      - "tooling/verify_runtime_independence.test.mjs"
      - "tooling/verify_private_file_cutover.mjs"
      - "tooling/import_base44_snapshot.mjs"
      - "tooling/import_base44_snapshot.test.mjs"
      - "tooling/replay_base44_change_journal.mjs"
      - "tooling/replay_base44_change_journal.test.mjs"
      - "tooling/base44_replay_bridge.ts"
      - "tooling/install_base44_rollback_compat.mjs"
      - "tooling/install_base44_rollback_compat.test.mjs"
      - "tooling/base44-rollback-compat/**"
      - "tooling/rehearsal_fixture_harness.ts"
      - "tooling/rehearsal_fixture_harness.test.ts"
      - "docs/migration/base44-rollback-replay-runbook.md"
      - "docs/migration/base44-import-runbook.md"
      - "docs/migration/private-file-import-verification.json"
      - "package.json"
      - "vitest.foundation.config.js"
      - "package-lock.json"
      - ".github/workflows/deploy-sst-test.yml"
      - ".github/workflows/deploy-sst-production.yml"
  push:
    branches: [main]
    paths:
      - "sst.config.ts"
      - "infra/sst/**"
      - "backend/api/**"
      - "src/api/**"
      - "src/App.jsx"
      - "src/pages/Maintenance.jsx"
      - "src/lib/maintenance-status.js"
      - "src/lib/__tests__/maintenance-status.test.js"
      - "e2e/**"
      - "playwright.config.js"
      - "lambda/pdf-generator/**"
      - "src/lib/pdf-api.js"
      - "src/lib/__tests__/pdf-api.test.js"
      - "src/pages/PdfSignIframeOverlay.jsx"
      - "tooling/verify_pdf_bundle.mjs"
      - "tooling/verify_pdf_bundle.test.mjs"
      - "tooling/verify_pdf_parity.mjs"
      - "tooling/verify_pdf_parity.test.mjs"
      - "docs/migration/pdf-parity-runbook.md"
      - "tooling/verify_sst_foundation.mjs"
      - "tooling/production-readiness-contract.json"
      - "tooling/verify_production_readiness.mjs"
      - "tooling/verify_production_readiness.test.mjs"
      - "tooling/verify_runtime_independence.mjs"
      - "tooling/verify_runtime_independence.test.mjs"
      - "tooling/verify_private_file_cutover.mjs"
      - "tooling/import_base44_snapshot.mjs"
      - "tooling/import_base44_snapshot.test.mjs"
      - "tooling/replay_base44_change_journal.mjs"
      - "tooling/replay_base44_change_journal.test.mjs"
      - "tooling/base44_replay_bridge.ts"
      - "tooling/install_base44_rollback_compat.mjs"
      - "tooling/install_base44_rollback_compat.test.mjs"
      - "tooling/base44-rollback-compat/**"
      - "tooling/rehearsal_fixture_harness.ts"
      - "tooling/rehearsal_fixture_harness.test.ts"
      - "docs/migration/base44-rollback-replay-runbook.md"
      - "docs/migration/base44-import-runbook.md"
      - "docs/migration/private-file-import-verification.json"
      - "package.json"
      - "vitest.foundation.config.js"
      - "package-lock.json"
      - ".github/workflows/deploy-sst-test.yml"
      - ".github/workflows/deploy-sst-production.yml"

permissions:
  actions: read
  id-token: write
  contents: read

concurrency:
  group: auditflow-sst-test
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # The enablement Environment must be separately protected by owner review and main-only deployment policy.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_legacy_file_reads && 'test-legacy-read-enable' || 'test' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: il-central-1
      AWS_DEFAULT_REGION: il-central-1
      SST_STAGE: test
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      EXPECTED_OIDC_AUDIENCE: sts.amazonaws.com
      EXPECTED_OIDC_SUBJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_legacy_file_reads && 'repo:noamtz@2631641/cpa-platform@1332935468:environment:test-legacy-read-enable' || 'repo:noamtz@2631641/cpa-platform@1332935468:environment:test' }}
      AUDITFLOW_ENABLE_LEGACY_FILE_READS: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_legacy_file_reads && 'true' || 'false' }}
      AUDITFLOW_EXPECTED_LEGACY_IMPORT_MANIFEST_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_legacy_file_reads && inputs.expected_legacy_import_manifest_sha256 || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.17.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate requested legacy-file mode before AWS access
        shell: bash
        run: |
          if [[ "${AUDITFLOW_ENABLE_LEGACY_FILE_READS}" == "true" ]]; then
            [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
            [[ "${GITHUB_REF}" == "refs/heads/main" ]]
            [[ "${AUDITFLOW_EXPECTED_LEGACY_IMPORT_MANIFEST_SHA256}" =~ ^[a-f0-9]{64}$ ]]
            node --input-type=module <<'NODE'
          import { checkPrivateFileCutover } from "./tooling/verify_private_file_cutover.mjs";
          const result = checkPrivateFileCutover({ stage: "test", requireFresh: false });
          if (!result.ready || result.sourceManifestSha256 !== process.env.AUDITFLOW_EXPECTED_LEGACY_IMPORT_MANIFEST_SHA256) {
            throw new Error("Requested manifest does not match verified import evidence");
          }
          NODE
          else
            [[ -z "${AUDITFLOW_EXPECTED_LEGACY_IMPORT_MANIFEST_SHA256}" ]]
          fi

      - name: Verify protected enablement environment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_legacy_file_reads }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/test-legacy-read-enable")"
          policies_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/test-legacy-read-enable/deployment-branch-policies?per_page=100")"
          ENVIRONMENT_JSON="$environment_json" POLICIES_JSON="$policies_json" node <<'NODE'
          const environment = JSON.parse(process.env.ENVIRONMENT_JSON);
          const policies = JSON.parse(process.env.POLICIES_JSON);
          const reviewerRules = (environment.protection_rules ?? []).filter(
            (rule) => rule.type === "required_reviewers",
          );
          const hasOwnerReviewer = reviewerRules.some((rule) =>
            (rule.reviewers ?? []).some(
              (entry) => entry.type === "User" && entry.reviewer?.login === "noamtz",
            ),
          );
          const branchPolicy = environment.deployment_branch_policy;
          const mainOnly =
            branchPolicy?.protected_branches === false &&
            branchPolicy?.custom_branch_policies === true &&
            policies.total_count === 1 &&
            policies.branch_policies?.[0]?.name === "main";
          if (!hasOwnerReviewer || !mainOnly) {
            throw new Error("Legacy-read enablement Environment protection is missing or has drifted");
          }
          NODE

      - name: Validate GitHub OIDC claims
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${EXPECTED_OIDC_AUDIENCE}")"
          OIDC_RESPONSE="$response" node <<'NODE'
          const response = JSON.parse(process.env.OIDC_RESPONSE);
          const token = response.value;
          if (!token) throw new Error("GitHub did not return an OIDC token");
          const payload = JSON.parse(
            Buffer.from(token.split(".")[1], "base64url").toString("utf8"),
          );
          if (payload.aud !== process.env.EXPECTED_OIDC_AUDIENCE) {
            throw new Error("Unexpected OIDC audience");
          }
          if (payload.sub !== process.env.EXPECTED_OIDC_SUBJECT) {
            throw new Error("Unexpected OIDC subject");
          }
          process.stdout.write("OIDC claim validation passed\n");
          NODE

      - name: Resolve canonical deployment target
        id: deployment-target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("infra/sst/deployment-targets.json", "utf8"));
          const target = manifest.targets?.[process.env.SST_STAGE];
          const expectedRoleArn = target && `arn:aws:iam::${target.accountId}:role/${target.deployRoleName}`;
          if (!target || target.region !== process.env.AWS_REGION || process.env.AWS_DEPLOY_ROLE_ARN !== expectedRoleArn) {
            throw new Error("GitHub Environment deployment target does not match the repository contract");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `account-id=${target.accountId}\nrole-arn=${expectedRoleArn}\n`);
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.deployment-target.outputs.role-arn }}
          role-session-name: auditflow-sst-test
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ steps.deployment-target.outputs.account-id }}
          mask-aws-account-id: true

      - name: Verify AWS session
        shell: bash
        run: |
          test "${AWS_REGION}" = "il-central-1"
          aws sts get-caller-identity --output json >/dev/null

      - name: Verify deployer permissions before stage mutation
        run: >-
          node tooling/verify_sst_foundation.mjs
          --mode deployer
          --stage test

      - name: Install SST platform types
        run: npm run sst:install

      - name: Validate foundation
        run: |
          npm run test:pdf
          npm run test:reverse-replay
          npm run test:foundation
          npm run typecheck:foundation
          npm run lint:foundation
          npm run build
          npm run verify:runtime-independence -- --frontend dist
          node tooling/verify_sst_foundation.mjs --mode contract --stage test
          npm run verify:readiness -- --mode contract

      - name: Preview test deployment
        run: npx sst diff --stage test --print-logs

      - name: Verify staged runtime independence
        run: npm run verify:runtime-independence -- --artifacts .sst/artifacts --no-manifests

      - name: Verify staged PDF runtime assets
        run: >-
          npm run verify:pdf-bundle --
          --artifacts .sst/artifacts
          --function PdfRendererFunction

      - name: Deploy requested test-stage file mode
        run: npm run sst:deploy:test

      - name: Verify live test foundation
        shell: bash
        run: |
          args=(--mode live --stage test --outputs .sst/outputs.json)
          if [[ "${AUDITFLOW_ENABLE_LEGACY_FILE_READS}" == "true" ]]; then
            args+=(--legacy-file-reads enabled --evidence docs/migration/private-file-import-verification.json)
          else
            args+=(--legacy-file-reads disabled)
          fi
          node tooling/verify_sst_foundation.mjs "${args[@]}"
